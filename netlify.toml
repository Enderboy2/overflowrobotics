plugins = []

[functions]

  [functions."*"]

[build]

  [build.environment]

  [build.processing]

    [build.processing.css]

    [build.processing.html]

    [build.processing.images]

    [build.processing.js]

  [build.services]

[[headers]]
for = "/assets/chunks/*"

  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/assets/media/*"

  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/media/*"

  [headers.values]
  Cache-Control = "public, max-age=604800"

[[headers]]
for = "/brand/*"

  [headers.values]
  Cache-Control = "public, max-age=604800"

[[headers]]
for = "/assets/site.js"

  [headers.values]
  Cache-Control = "public, max-age=3600"

[[redirects]]
